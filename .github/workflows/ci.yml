name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      force_nuget_publish:
        description: Force NuGet publish for non-master builds
        type: boolean
        default: false

env:
  PROJECT: src/NLog.Targets.MauiLog/NLog.Targets.MauiLog.csproj

jobs:
  build:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        run: dotnet build ${{ env.PROJECT }} --configuration Release --no-restore --framework net10.0

  pack:
    name: Build & package (Windows)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: windows-nuget-maui-${{ hashFiles('global.json', 'src/NLog.Targets.MauiLog/NLog.Targets.MauiLog.csproj') }}
          restore-keys: windows-nuget-maui-

      - name: Install MAUI workloads
        run: dotnet workload install maui macos android ios maccatalyst --skip-manifest-update

      - name: Restore
        shell: pwsh
        env:
          TARGET_FRAMEWORKS: net10.0;net10.0-ios;net10.0-macos;net10.0-android;net10.0-maccatalyst
        run: $env:TargetFrameworks = $env:TARGET_FRAMEWORKS; dotnet restore $env:PROJECT

      - name: Determine version suffix
        id: version
        shell: pwsh
        env:
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF -eq "refs/heads/master") {
            echo "suffix=" >> $env:GITHUB_OUTPUT
          } elseif ($env:PR_NUMBER) {
            echo "suffix=pr.$($env:PR_NUMBER).ci.$($env:RUN_NUMBER)" >> $env:GITHUB_OUTPUT
          } else {
            echo "suffix=ci.$($env:RUN_NUMBER)" >> $env:GITHUB_OUTPUT
          }

      - name: Create NuGet package
        shell: pwsh
        env:
          VERSION_SUFFIX: ${{ steps.version.outputs.suffix }}
          TARGET_FRAMEWORKS: net10.0;net10.0-ios;net10.0-macos;net10.0-android;net10.0-maccatalyst
        run: $env:TargetFrameworks = $env:TARGET_FRAMEWORKS; dotnet pack $env:PROJECT --no-restore --configuration Release --output artifacts -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -p:EmbedUntrackedSources=true -p:ContinuousIntegrationBuild=true -p:PublishRepositoryUrl=true --version-suffix "$env:VERSION_SUFFIX"

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: NuGetPackages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish:
    name: Publish NuGet package
    needs: [build, pack]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.force_nuget_publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v7
        with:
          name: NuGetPackages
          path: artifacts

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate